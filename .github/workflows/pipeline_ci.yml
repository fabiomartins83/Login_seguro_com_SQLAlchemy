name: CI - Validar Projeto Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar-codigo:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: 3. Configurar Cache do Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 4. Instalar dependências e ferramentas (Ruff e pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit bandit

      - name: 5. Executar linting com Ruff
        run: ruff check .

      - name: 6. Executar análise de segurança de código com Bandit
        run: bandit -r . -ll

      - name: 7. Auditar dependências por vulnerabilidades
        run: pip-audit -r requirements.txt

      - name: 8. Executar testes automatizados
        run: |
          pytest --cov=login_seguro_with_orm --cov-report=term-missing

      - name: 9. Verificar sintaxe e importações
        run: |
          python -m py_compile login_seguro_with_orm.py
          python -c "import argon2, sqlalchemy; print('Dependencias instaladas com sucesso.')"