name: CI - Validar Projeto Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar-codigo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: 3. Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verificar sintaxe e importações
        run: |
          python -m py_compile login_seguro_with_orm.py
          python -c "import argon2, sqlalchemy; print('Dependencias OK!')"
